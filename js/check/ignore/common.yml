  理由: C# .NET 专属运行时特性与内部辅助面，按四类分述（rust 侧等价架构原生实现，逐类已核同名零命中）：
    一、SocketAsyncEventArgs / SslStream / MemoryPool / ArrayPool / GCHandle
    网络与托管缓冲面（Networking/* 全部、Memory/* 全部、ClientBase、LightClient*、
    ElasticCircularBuffer 枚举器与 IsEmpty/IsFull、ReadOnlySequence* 、
    RespMemoryWriter 的 AsReadOnlySpan/DecreaseArrayLength/GetPosition/Realloc/
    ReallocateOutput/ResetPosition/TryWriteBulkString/TryWriteDirect/TryWriteFalse/
    WriteNewLine/WriteTrue 与 RespWriteUtils 全族 Try*（返回 bool 的「缓冲不足即重试」 形态，rust
    侧写器改为自动扩容 Vec<u8>，无失败分支），rust 以 compio + 自有 wbase/pool 承接；fn
    as_read_only_span / decrease_array_length / realloc / reallocate_output /
    reset_position / try_write_bulk_string / try_write_direct / write_new_line
    全仓零同名命中；二、C# 锁与同步原语（Synchronization/* 全部、
    ReaderLock、LightConcurrentStack.TryPop、TaskToApm），rust 以 parking_lot
    与原子量承接；三、BCL 数值与格式化工具（Format.*、NumUtils.*、BitVector.*、
    HashUtils.MurmurHash3*、EnumExtensions/EnumUtils/GarnetKeyComparer、
    RandomUtils 抽样族），rust 以 std/itoa/ryu/w/hashers 与 gxhash 承接；四、 测试故障注入与
    ILogger 基建（Testing/ExceptionInjectionHelper.*、
    FileLoggerProvider.*、GarnetTestLoggingEventType.LogTesting、 SessionLogger
    同类面），rust 侧不设 C# 式异常注入开关。本块不含已实现项： RespMemoryWriter.cs 的 11 个
    Write*（AsciiDirect/DoubleBulkString/DoubleNumeric/
    EmptyMap/Int64/IntegerFromBytes/One/PushLength/Utf8BulkString/VerbatimString/Zero）
    已在 wresp/src/resp_memory_writer.rs:453,501,537,565,640,650,656,674,730,744（
    write_verbatim_string 另见 :209,:298 与 wresp/src/output.rs:148）实现；
    NetworkBufferSettings.cs:GetInclusive/CreateBufferPool 曾于
    wbase/src/pool/limited.rs 复刻，经复核为复制/迁移流全局单池下的零消费死规格， 已随规格整面删除并转入 ignore 登记（见
    garnet/libs/common/NetworkBufferSettings.yml）； 以上 11 条（RespMemoryWriter
    Write* 族）仍处已实现待补 /// C#路径:函数名 映射注释状态（见 next/ignore-honesty-mapping.md）
