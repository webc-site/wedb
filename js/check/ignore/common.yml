  理由: C# 同步与锁原语族，逐件说明 rust 承接点（非笼统「parking_lot」）： DoubleTurnstileBarrier 非空白，已在
    wnode/src/aof/recover/double_turnstile_barrier.rs 以 Event+原子相位计数器 bespoke
    复刻（struct/new 与两个异步变体 SignalWorkReadyWaitAsync /
    SignalWorkCompletedWaitAsync 均已 /// 映射；两个内部例程 SignalWorkReadyInternal/
    SignalWorkCompletedInternal 归并至 wait_phase 的「递增到 participant_count 即翻转代际并唤醒」
    单点，已映射；两个阻塞变体见本文件末尾块），此处忽略 ProcessTimeSpan——它是 .NET SemaphoreSlim 的
    timeout/cancellation 形参适配器，rust 栅栏取消超时面（对外无 timeout 参），无对应实现；
    LeaderBarrier.TrySignalOrWait 同理由 bespoke 之外的 .NET Barrier 语义承接，rust 无同名实现。
    ReadOptimizedLock（每核分片自旋读写锁）、SingleWriterMultiReaderLock（单写多读原子标志锁）、
    ActiveWorkerMonitor（TryEnter/TryOpen
    活跃工作计数）、CooperativeDisposeGuard（协作式释放守卫） 在 rust 全仓零同名类型/函数（已核
    struct/trait/fn 定义零命中），由 wtxn/wbftree 侧 parking_lot 读写锁、原子量与 RAII Drop
    语义就地承接，不做逐同名映射。
