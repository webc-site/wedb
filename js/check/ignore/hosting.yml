  理由: C# .NET Generic Host 宿主框架，Rust 侧通过 compio
    独立运行时承接；TryParseCommandLineArguments 三层合并（默认值→配置文件→命令行显式项）对标实现为 wconf
    ConfigFileArgs::from_args_iter +
    NodeArgs::override_explicit，--config/--config-export-path 收敛 nested_text
    单格式（GarnetConf/RedisConf 双格式与 Azure 存储导入导出不转写）；Options.cs 冷门项不转写清单：reviv 分桶细化 4 项（reviv-bin-record-sizes/counts、search-next-higher-bins、
    best-fit-scan-limit、in-chain-only；wreviv 复活池已由 wconf 投影 reviv/reviv-fraction/copy-reads-to-tail 三旋钮，脱钩无
    条件化随 RMW 原子票同批落地，见 reviv-knobs 票）、index-resize 系（BfTree 拓扑无 Tsavorite
    哈希索引）、max-inline-key/value-size 与 initial-io-record-size（无 hybrid log inline
    概念）、aof-memory/page/segment-size（旗标与 nested_text 已转写：
    NodeArgs 三面旗标经 runtime_server_options 单点投影，RuntimeServerOptions
    同名项为启动播种源 + CONFIG GET 只读回显，字节折算与组合体检唯一真源在
    wnode AofSettings::from_options）、aof-physical-sublog-count/aof-replay-task-count 等多日志拓扑项（生产恒单物理日志，见
    glm.md 条 26）、aof-size-limit
    系（槽位已声明无自动检查点消费者）、latency-monitor（set_global_latency_metrics
    生产零调用）、minthreads/maxthreads/miniothreads/maxiothreads（.NET 线程池专属，compio
    一线程一核）、use-azure-storage 与 aad
    系（红线禁用）、checkpoint-throttle-delay（C# 该旋钮只节流 AsyncFlushPagesForSnapshot 的逐页
    WriteAsync 循环，FlushCompletionTracker 以容量 1 信号量做每页等完成再发下一页的串行闸，再叠
    Thread.Sleep，载体 GarnetServerOptions.CheckpointThrottleFlushDelayMs 默认 0 经 GarnetServer
    注入 kvSettings.ThrottleCheckpointFlushDelayMs，再到 CheckpointSettings 与 SnapshotCheckpointSMTask
    的 AllocatorBase 节流臂；rust 快照刷盘为 whlog PendingFlushList 贪心合并相邻区间后的单次连续
    flush_range_aligned 写（hlog/io.rs flush_sealed_page_range），不存在逐页 WriteAsync 节流点可插，
    Task.Run 隔离臂在 compio 一线程一核下亦无独立刷盘线程可退，合并大写连同先封再刷屏障即既定节奏形态，
    旋钮五级链（配置槽位、投影、注入、页间睡眠分段、索引快照同参）整链不转写；若未来刷盘改分段下发，
    须与节奏旋钮一次同改，禁止另立第二套节流面）；GarnetServerOptions.cs 侧同题登记该旋钮载体字段
    CheckpointThrottleFlushDelayMs（默认 0）与其 GetSettings 装配臂不转写，随本清单收口；已转写活项：slowlog-log-slower-than、slowlog-max-len、max-databases、protected-mode、object-scan-count-limit、metrics-sampling-freq（NodeArgs::runtime_server_options
    投影 RuntimeServerOptions 播种）；本轮收口四项：CompactObjectJsonConverter.Read/AreEqual
    与 PopulateObjectJsonConverter.Read 为 System.Text.Json 反序列化与默认值比对臂，随 JSON 配置
    格式整链不转写（nested_text 单格式，ConfigProviders.TryDeserializeOptions 同链）；Options.Clone
    为 ServerSettingsManager.cs:98/122 的反射克隆合并臂，合并语义由 wconf
    ConfigFileArgs::from_args_iter + NodeArgs::override_explicit 承接；MemoryLogger.IsEnabled/Log/Dispose
    为 Microsoft.Extensions.Logging ILogger 管线样板，rust 统一 log 门面替代
