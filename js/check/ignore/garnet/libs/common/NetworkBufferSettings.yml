# PR #2157 后 rust 补齐规格对象与建池入口（wedb/wbase/src/pool/settings.rs
# NetworkBufferSettings::create_buffer_pool——预算参与、闲置字节上限、规格级
# 下探接收地板的建池面）；CreateBufferPool 已实现并移出本表。GetInclusive
# 服务 C# 每流差异化规格聚合（客户端多池），rust 客户端单池直建仍无消费面。
- 文件:
    - libs/common/NetworkBufferSettings.cs:
        - GetInclusive
  理由: >-
    GetInclusive 服务「每流差异化缓冲规格聚合后建池」形态，rust 侧各流分
    包/装批尺寸由装配点本地常量承接（replica_diskless_sync 的 DEFAULT_
    DISKLESS_CHUNK_SIZE、snapshot_transmission 的 SNAPSHOT_CHUNK_SIZE、
    migrate_driver/keys 的 MAX_CHUNK_FALLBACK、migration_manager 的
    max_send_buffer_content_size），池统一按单点尺寸直建，聚合入口无第二
    套规格必要
