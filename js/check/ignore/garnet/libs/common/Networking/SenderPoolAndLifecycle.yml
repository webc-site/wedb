  理由: SAEA 对象池与响应对象池的出入场协议（Enter/Exit 借还 SocketAsyncEventArgs 与 响应缓冲头指针）：rust
    无池化出入场协议，一线程一 CPU 的 compio pump 模型下 会话独占写缓冲、所有权随会话移动并由 Drop 归还，无借还动词可挂对位体。
    本仓既有的缓冲复用面已由 wbase/src/pool 与 wresp/src/resp_memory_writer 单点
    承担，其映射在册，与本族池协议不同根
