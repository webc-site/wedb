    - libs/common/Networking/NetworkSenderBase.cs:
        - Dispose
        - DisposeNetworkSender
        - TryClose
    - libs/common/Networking/TcpNetworkHandlerBase.cs:
        - TryClose
  理由: 显式关闭时序（TryClose 先置 closing 标志再关 SAEA 与 socket、 DisposeNetworkSender 由
    handler 反向处置其 sender）：rust 发送器与流句柄为 所有权值，离开作用域即析构关
    fd（wedb/wnode/src/net/stream.rs 的流与 wedb/wconn/src/network/stream.rs
    的出站句柄皆然），断连时序由 pump 结束分支 单点收敛（wedb/wnode/src/net/handler/drive.rs），无二次关闭幂等口与
    「handler 处置 sender」的互相引用面
- 文件:
    - libs/common/Networking/TcpNetworkHandlerBase.cs:
        - Start
        - StartAsync
    - libs/common/Networking/NetworkHandler.cs:
        - Process
        - StartAsync
  理由: 监听接受与请求处理循环（Start/StartAsync 注册 accept 与首个 receive 的 SAEA、 Process
    从接收缓冲取命令并回写）：rust 侧 accept 与读写循环由 wedb/wnode/src/net/handler/drive.rs 的会话泵与
    wedb/wnode/src/net/stream.rs 的流建立承担，命令处理在 resp_server_session 侧，均为已在册的其它映射，
    本族 C# 口是宿主时序壳，无独立方法体
