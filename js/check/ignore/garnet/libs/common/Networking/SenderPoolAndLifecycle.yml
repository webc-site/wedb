    wedb/wnode/src/resp/resp_server_session/attach.rs:249 is_local_connection
    （auth.rs:221 的保护级别判定即调该口），C# 把同一判定沿 sender/handler 继承链铺开四层是接口形状所需，rust
    不再按层复刻
- 文件:
    - libs/common/Networking/GarnetTcpNetworkSender.cs:
        - Send
  理由: 出站写口在 rust 单点为 wconn/src/network 族（stream.rs 建连与写、pump.rs 溢流搬运、replies.rs
    应答组装），且 C# Send 是 NetworkSenderBase 的 abstract 同步写口（内部仍是 SAEA 异步提交），rust 侧以
    async 写 + AutoFlushableBufStream 承接，无同名同步 Send 形态
