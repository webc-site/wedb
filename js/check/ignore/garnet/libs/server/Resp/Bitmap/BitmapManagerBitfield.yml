# wbitmap 导出面残余（task/ing/wbitmap-length-from-type-orphan-and-islargeenoughfortype.md）：
# C# IsLargeEnoughForType 仅在存储侧 RMWMethods.cs:612 调用，服务于 BITFIELD 预 sizing。
- 文件:
    - libs/server/Resp/Bitmap/BitmapManagerBitfield.cs:
        - IsLargeEnoughForType
  理由: >-
    有意改道而非漏接（逐调用点亲验）：C# IsLargeEnoughForType 为 LengthFromType(args) <= vlen，
    仅在存储侧 RMWMethods.cs 用于 BITFIELD 预判长短。rust 无该存储侧预 sizing 设计，
