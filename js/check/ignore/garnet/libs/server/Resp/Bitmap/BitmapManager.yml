- 文件:
    - libs/server/Resp/Bitmap/BitmapManager.cs:
        - IsLargeEnough
        - Length
        - NewBlockAllocLength
        - TryValidateLengthInBytes
  理由: 有意改道而非漏接（逐调用点亲验）：C# 前三者的生产调用全在存储侧 RMW 预 sizing
    链路——RMWMethods.cs:162（InitialUpdater SETBIT Length）、RMWMethods.cs:572,574
    （InternalUpdater SETBIT IsLargeEnough+Length）、VarLenInputMethods.cs:119
    （GetInitialRecordSize SETBIT Length）、VarLenInputMethods.cs:272
    （GetVarLenRecordSize SETBIT NewBlockAllocLength）；TryValidateLengthInBytes（:27）
    在 C# 仅为 StringBitmapSetBitUnsafe（:94）内部私有偏移校验。rust 无存储侧预 sizing
    设计，SETBIT 长度与偏移校验改由会话层承接：wedb/wnode/src/resp/bitmap/bitmap_commands.rs:54
    network_string_set_bit 内联 byte_idx=offset/8 判长短（≡IsLargeEnough）并
    resize(byte_idx+1)（≡Length，只增不减 ≡NewBlockAllocLength 的 max 语义），BITFIELD
    侧分配尺寸单源为 wbitmap/src/bitfield/parse.rs new_block_alloc_length_from_type（≡C#
    NewBlockAllocLengthFromType，wnode slow.rs/bitmap_commands.rs 生产连通）。与
    manager.rs 转写版构成第二真值源，按「一处定义」清退孤儿份，保留生产份，并在
    bitfield/mod.rs::alloc_length_single_source_parity 补跨载体等价性断言防与独立字节跨度式漂移。行为由
    wnode/tests/garnet_bitmap.rs SETBIT 用例覆盖。

