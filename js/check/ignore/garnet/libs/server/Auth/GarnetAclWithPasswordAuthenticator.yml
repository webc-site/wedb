# ACL + 口令子档认证器在 rust 无独立落点，仅保留其口令校验内核。
#
# C# GarnetAclWithPasswordAuthenticator 继承 GarnetACLAuthenticator 基类，
# 仅覆写 AuthenticateInternal（ASCII 规范口令 → 取哈希 → 校验生效用户）。
# rust 侧该内核抽为自由函数 `acl_password_check`
# （wedb/wacl/src/auth/garnet_acl_authenticator.rs，文档注释对标本文件
# AuthenticateInternal），注入 `GarnetAclAuthenticator::authenticate` 模板
# 方法，会话 AUTH 路径（wnode/src/resp/resp_server_session.rs:authenticate_user）
# 与测试域共用，组合职责已在会话内联承接。
# 子档类型本身（构造器）全仓零生产消费，已随 IGarnetAuthenticator 接口
# 一并删除（见同目录 IGarnetAuthenticator.yml）。

- 文件:
    - libs/server/Auth/GarnetAclWithPasswordAuthenticator.cs:
        - GarnetAclWithPasswordAuthenticator
  理由: >-
    ACL + 口令子档类型无落点：rust 会话内联承接——口令校验内核
    AuthenticateInternal 由 wacl acl_password_check 自由函数对标并注入
    GarnetAclAuthenticator::authenticate 模板方法，子档包装类型与接口
    trait 全仓零生产消费，一并删除（AuthenticateInternal 本身不在忽略之列）
