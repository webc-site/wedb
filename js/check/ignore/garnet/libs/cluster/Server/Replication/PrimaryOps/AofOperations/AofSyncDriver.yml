# C# AofSyncDriver.DisposeClient（:138）仅遍历子任务 dispose 其 garnetClient（网络
# 客户端对象），与 Dispose（任务级）分离以便复用任务骨架只换连接。rust 侧连接由
# AofSyncWire 归 AofSyncTask 所有（attach_wire 挂载），客户端即 wire 本体，生命周期
# 随 task.dispose 一并释放，不存在可独立处置的 client 对象，故无对应实现
- 文件:
    - libs/cluster/Server/Replication/PrimaryOps/AofOperations/AofSyncDriver.cs:
        - DisposeClient
  理由: 经重构移除——rust 连接（AofSyncWire）为 AofSyncTask 所有并随任务
    dispose 一并释放，无独立 client 对象需要单独处置
# task/ing/gate-anchor-drift-reclean.md 条 二逐族甄别（AofSyncDriver 建连与攒批发送面）。
# 取证：AofSyncDriver.cs:181 ConnectClientsAsync 逐子任务 garnetClient.ConnectAsync 批量建连，
# rust 侧驱动只接受已建成的通道句柄——diskless 链在
# wedb/src/server/replication/diskless_replication/replica_sync_session.rs begin_aof_sync 内
# TcpSessionWire::connect 后 attach_wire，diskbased 链在
# wedb/src/server/replication/replica_sync_session.rs initiate_replica_sync 同位建连，
# 驱动无 client 集合可批量连接；AofSyncDriver.cs:209 SendAndResetIterationBufferAsync 委托
# aofSyncTasks[0].garnetClient 的迭代缓冲发送重置，rust 快照流迭代缓冲收敛为扇出迭代器共享攒批
# （见 diskless_replication/replica_sync_session.rs 模块自述与
# diskless_replication/replication_snapshot_iterator.rs fan_out_send 停等广播），AOF 推流侧为
# APPENDLOG 帧直写，无逐驱动的具名攒批发送面
- 文件:
    - libs/cluster/Server/Replication/PrimaryOps/AofOperations/AofSyncDriver.cs:
        - ConnectClientsAsync
        - SendAndResetIterationBufferAsync
  理由: 建连与攒批发送在 rust 归装配方与扇出迭代器（连接先于驱动入册、
    攒批按批共享），驱动侧无该两面，无对应实现
# task/ing/net-check-anchor-fullpath.md 条 12 三（AofSyncDriver 的 TryWrite 一族）。
# 取证：C# 该二枚均为纯转发体（AofSyncDriver.cs:203-207 一行转调
# aofSyncTasks[0].garnetClient 的同名口），本身无逻辑；rust 侧驱动面
# （wedb/wedb/src/server/replication/aof_sync_driver.rs 的 AofSyncDriver）零写记录口，
# 逐记录推流由子任务承担：aof_sync_task.rs:226 AofSyncTask::consume 组完整
# APPENDLOG 记录帧后经 replica_wire.rs:434 append_log 直发或入溢流队列；
# 超大记录的分块在发送面前置完成（wconn/src/record.rs:511 send_chunked_record
# 产出 Chunk 帧），故不存在 C# 「驱动持客户端攒写缓冲、空间不足返 false 并回
# 送 flush task」的协议面，无对位实现可挂锚
- 文件:
    - libs/cluster/Server/Replication/PrimaryOps/AofOperations/AofSyncDriver.cs:
        - TryWriteRecordSpan
        - TryWriteChunkedRecordSpan
  理由: >-
    纯转发口无对位体——rust 驱动不持发送缓冲：整记录推流落
    AofSyncTask::consume（aof_sync_task.rs:226）→ replica_wire.rs:434
    append_log 帧直发，分块落 send_chunked_record（wconn/src/record.rs:511）
    产 Chunk 帧，快照扇出落 replication_snapshot_iterator.rs fan_out_send，
    无 TryWrite 返布尔的缓冲剩余空间协议


