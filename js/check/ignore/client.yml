  理由: >-
    C# 该 partial class 的六个成员（CopyLatencyHistogram、ResetLatencyHistogram、
    GetPercentiles、GetLatencyMetrics、GetOutstandingRequestsMetrics、
    DumpLatencyHistToConsole）唯一的取数来源是 GarnetClient 构造形参 recordLatency，
    而全仓传 true 的调用点只落在基准与演练树：benchmark/Resp.benchmark 的
    --client-hist 面（Options.cs ClientHistogram → RespOnlineBench.cs、TxnPerfBench.cs、
    ClusterBench/ClientRequestProvider.Offline.cs、ClientRequestProvider.Online.cs、
    ClientRequestProvider.WorkerPool.cs）、playground/GarnetClientStress、
    test/standalone/Garnet.test/GarnetClientTests.cs SimpleMetricsTest；三处均已登记
    不移植（benchmark.yml 的「C# BenchmarkDotNet/RESP 专属基准测试，Rust 侧采用
    criterion/独立压测」块、本文件顶部 playground 块、test.yml 的 GarnetClientTests.cs
    块）。rust 侧本仓压测树不消费 wconn 客户端，wconn 客户端为集群控制面专用
    （认领点 wedb/src/client.rs），生产唯一构造点把 record_latency 写死 false，
    整条取时—结算—查询链恒无读者，故不实现本文件；原对位实现 wconn/src/metrics.rs
    及其 sent_at 取时链随零读者判定删除，不为已登记不实现的基准面另造宿主
