# task/ing/gate-anchor-drift-reclean.md 条 二逐族甄别（client 侧 LightEpoch 副本的 waiter 让出组合）。
# 取证：garnet/libs/client/LightEpoch.cs:314 SuspendResume 只由 waiterCount > 0 分支驱动（:306
# ProtectAndDrain 尾部），而条目预留等待面（ReserveEntryWait / TryAcquireEntry / SelectInstance /
# GetRef）在本文件上方块已登记不实现；rust wepoch 槽位获取为 CAS 抢占 + Backoff::snooze 自旋
# （wedb/wepoch/src/epoch.rs resume 慢路径），既无等待者计数也无阻塞等待队列，让出窗口无触发方；
# Suspend / Resume / TrySuspend / ProtectAndDrain 本体均在 wepoch 挂有本文件路径的文档注释锚点
- 文件:
    - libs/client/LightEpoch.cs:
        - SuspendResume
  理由: C# 纪元「挂起再恢复」的等待者让出组合无 rust 对位——wepoch 取槽为 CAS 自旋退避，
    无 waiterCount 与阻塞等待队列，组合无触发场景；同口径见 storage.yml 的 core/Epochs 块

