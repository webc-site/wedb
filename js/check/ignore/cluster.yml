  理由: 已实现等价 / 整合式原生实现：主端检查点下发与副本接收落盘、AOF 同步驱动族（wedb/src/server/replication/ 下
    snapshot_transmission.rs、
    replica_diskbased_sync.rs、receive_checkpoint_handler.rs、replica_sync_session.rs、
    replica_diskless_sync.rs、aof_sync_driver.rs、aof_sync_task.rs、driver_registry.rs、
    replica_replay_driver_store.rs、checkpoint_store.rs 各文件头注明对标清单；副本侧页屏障重放的 C#
    AOFReplayDriver/Task 面对应 driver_registry.rs 与
    replica_replay_driver.rs，tests/aof_sync_driver_store.rs 仅为集成测试件不作为对标文件）；rust
    未复刻 C#
    逐私有方法面（Dispose/IOCallback/HandleIOError/CreateFileDataSource/SafeTailPageShiftCallback
    等桥接与句柄件，acquire_checkpoint_entry / validate_metadata / begin_aof_sync /
    set_cluster_sync_header / is_progressing / wait_or_die /
    add_replica_sync_session 在 rust 全仓零同名命中，已核），整文件忽略自动淘汰机制（要求 garnet
    方法全集精确映射）不适用，滞留属注释形态受限。
    函数级收窄（qw-net-anchor-mapping-corrections）：FileDataSink.Dispose 与 Complete 同体
    （C# 两方法皆为 device?.Dispose()，rust complete 即终局、句柄随 Drop 释放，无独立收置面）；
    FileDataSink.IOCallback 为 Tsavorite 设备异步回调桥接件（writeSemaphore/lastIOErrorCode
    信号链），rust compio 读写直驱无回调语义（模块文档登记差异）；MetadataDataSink.Dispose
    为空方法（C# 原文 Nothing to dispose），rust 无需实现；ReceiveCheckpointHandler 四方法与
    RangeIndexFileDataSink 四方法已全量文档化于 receive_checkpoint_handler.rs，撤销整文件滞留
