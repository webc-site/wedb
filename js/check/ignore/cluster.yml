  理由: 经重构移除的双轨抽象：rust 单轨承接——槽位/键迁移分类在 migrate_driver/
    live_value.rs read_live_value（string→信封→Meta→向量登记表，按 rust KeyTag 物理模型，不用 C# 数值 RecordType
    遗留常量），RangeIndex 走 get_range_index_keys_for_migration 带外通道， 向量集走
    collect_vector_set_keys/get_vector_set_keys_for_slots
    发现面（migrate_session_vector_set.rs）， 取消令牌与发射编排由
    execute_slots_migration/execute_keys_migration 内联，无独立 MigrateOperation
    类型。新增两项同因：Contains 为 session._sslots 的一行成员判属，rust 侧
    由 slots 字段直接判属（migrate_session.rs can_access_key）加槽位索引枚举
    天然满足，无独立对应物；InitializeAsync 两步拆分承接——连接检查由
    begin_migration_phase 持有 MigrateSession.cs CheckConnectionAsync
    锚、发送迭代缓冲在 rust 装批模型（transmit_keys 的 cur_batch）下无对应物。
    Scan/DeleteKeys/DeleteVectorSet/TransmitKeysAsync/TransmitSlotsAsync/
    Dispose 六件已逐件挂锚于 migrate_driver/slots.rs、migrate_driver/keys.rs
    与 migrate_session_vector_set.rs
