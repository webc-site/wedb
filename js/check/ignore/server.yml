    一、[Conditional("DEBUG")] / [UnmanagedCallersOnly] 与 GC
    钉定指针辅助——ConvertToHeap、
    FromPinnedPointer、AlignOrPin、AssertAlignment、GetPendingScratchOutput；二、Tsavorite
    IFunctions
    回调协议面（InitialDeleter/PostRMWOperation/Reader/Post*KeyConsistentReadCallback/
    RMWCompletionCallback/ReadCompletionCallback/WriteLogUpsert/WriteLogDelete/EvaluateExpire*
    等），wkv 存储层以记录级原生接口承接，无逐回调分发层（同族登记另见本文件 ReadMethods/ RMWMethods 块）；三、C#
    接口枚举器与 ILogger 面（GetEnumerator、BeginScope/Log），rust 以 切片迭代与 wmetric/tracing
    原生承接；四、SIMD 生成的命令哈希表与 .NET 解析器（
    RespCommandHashLookup*.cs、RespCommandSimdPatterns.cs、AsyncProcessor.cs），rust
    命令枚举 单点在 wresp 的 RespCommand 定义。本块不含已实现项；DiskANN [LibraryImport] P/Invoke
    声明面自本块拆出独立登记（见下一块）
