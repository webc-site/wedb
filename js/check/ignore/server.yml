    共用同一 hlog 页容量，故 PageSizeBits/ReadCachePageSizeBits 无独立对位函数）；
    GetAofDevice/GetInitializedDeviceFactory/GetSettings/GetAofSettings/Initialize/
    GetBufferPoolMemoryBudgetBytes/GetInitialIORecordSizeBytes 为 .NET
    DeviceFactory 与 BufferPool 装配面，由 RuntimeServerOptions
    字段直读承接；GetCheckpointDirectoryName/
    GetStoreCheckpointDirectory/GetAppendOnlyFileDirectoryName/GetAppendOnlyFileDirectory
    为 C# GarnetServerOptions.cs:685-713 目录推导族，rust 目录推导单点集中在 NodeArgs 与
