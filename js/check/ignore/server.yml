  理由: C# .NET 专属运行时特性与 Tsavorite 回调面，按四类分述（rust 侧等价架构原生实现，逐类已核）：
    一、[Conditional("DEBUG")] / [UnmanagedCallersOnly] 与 GC
    钉定指针辅助——ConvertToHeap、
    FromPinnedPointer、AlignOrPin、AssertAlignment、GetPendingScratchOutput；二、Tsavorite
    IFunctions
    回调协议面（InitialDeleter/PostRMWOperation/Reader/Post*KeyConsistentReadCallback/
    RMWCompletionCallback/ReadCompletionCallback/WriteLogUpsert/WriteLogDelete/EvaluateExpire*
    等），wkv 存储层以记录级原生接口承接，无逐回调分发层（同族登记另见本文件 ReadMethods/ RMWMethods 块）；三、C#
    接口枚举器与 ILogger 面（GetEnumerator、BeginScope/Log），rust 以 切片迭代与 wmetric/tracing
    原生承接；四、SIMD 生成的命令哈希表与 .NET 解析器（
    RespCommandHashLookup*.cs、RespCommandSimdPatterns.cs、AsyncProcessor.cs），哈希查表
    语义由 wnode/src/resp/parser/command_table.rs 有序名称表二分（lookup_primary/
    lookup_subcommand）承接、SIMD 16 字节模式比对由 fast_patterns.rs 标量等价承接 （模式字节逐项对齐
    RespCommandSimdPatterns.cs），不转写代码生成器产物。本块不含已实现项； DiskANN [LibraryImport]
    P/Invoke 声明面自本块拆出独立登记（见下一块）；SessionParseState 块十三名逐条判：参数读口族为 类型级架构决策，不设
    parseState 级读口（wresp/src/session_parse_state.rs:17-19 自述 「参数转数值单点为
    wbase::num 严格解析面，同一参数不得有两套入口与两种严格性口径」）， GetBool/GetInt/GetLong 直读三兄弟与
    TryGetLong/TryGetDouble/TryGetFloat/ GetDouble/GetFloat 同因同族（Get 与 TryGet 仅
    out 形态差）：走 wbase/src/num.rs 的 strict_i64/strict_f64/strict_f32（调用点叙述对位见
    wnode/src/resp/basic_commands/incr.rs:54、 slow.rs:453），Bool 系走
    wedb/src/server/cluster_session/replication.rs:751 就地 T/F 判形，GetString 走
    wresp/src/ext.rs RespSliceExt 的 as_str_safe 字节视图直取 （同族下标壳另见 wnode
    session_parse_state_extensions 模块头自述），DeserializeFrom 无 parseState 级反序列化口、由
    ReplayInput 等承载结构自解（见本文件 InputHeader.cs 块理由）；EnsureCapacity 槽位扩容由 initialize
    与 read 的按需 resize 承接
    （session_parse_state.rs:46/:140），InitializeWithArguments 参数装入走
    initialize(count) 加 pub root_buffer
    字段直填（initialize_with_arg/initialize_with_args
    已随零消费口删除，session_parse_state.rs:199 自述），SetArgument/SetArguments 槽位写入 走 pub
    字段与 read()，其 C# 消费域（Vector 假写重放/ObjectStore 双轨/Custom 模块层）
    均已按块登记不转写。Resp/RespServerSession.cs 九名：数据库会话管理族
    （CreateDatabaseSession/TryGetOrSetDatabaseSession/SwitchActiveDatabaseSession/
    TrySwapDatabaseSessions/CreateConsistentReadApi）随 databaseSessions 会话数组删除消失，
    rust 单日志多库为单存储会话加活动库标量——SELECT 切库单点已锚
    libs/server/Resp/RespServerSession.cs:TrySwitchActiveDatabaseSession
    （wnode/src/resp/resp_server_session/core.rs:1055），SWAPDB 由
    wkv/src/session/swap.rs 的 swap_databases 承接（见本文件 TrySwapDatabases 块）， 一致读由
    wkv/src/session/consistent_read.rs 会话内上下文承接，不设第二 db 会话； DebugSend
    为逐字节发送调试变体零承接；GetObjectOutput/GetUnifiedOutput/Write
    三组为钉定指针输出铸造与存储回调就地写应答重载，由 output Vec 缓冲单点承接 （见本文件 UnifiedOutput.cs
    块理由）。Storage/Functions/MainStore/PrivateMethods.cs 四名： 数值就地/拷贝更新口
    TryInPlaceUpdateNumber/TryCopyUpdateNumber 无对位——rust 数值 RMW 走 try_rmw_sync
    写回完整新值（incr.rs:160），其 rust 侧叙述提及（incr.rs:212） 仅涉 INCRBYFLOAT
    结果溢出旗标语义面，非同名实现；IsValidNumber 旧值校验由读取闭包 strict_i64
    就地对位（incr.rs:132、slow.rs:417，拒前导零同语义）； TryCopyValueLengthToOutput 的长度 ASCII
    写出由命令臂就地 write_resp_int 承接； WriteValAndEtagToDst 的 [etag, value] 数组写出由
    libs/common/RespWriteUtils.cs:WriteEtagValArray 对位单点承接
    （wnode/src/resp/basic_etag_commands.rs:37，容量预算与堆回落随 output Vec 增长模型消失）；
    CopyTo 的 ReadOnlySpan → StringOutput 局部拷贝由 rust 切片 copy_from_slice 原生承接， wkv
    raw 会话零同名痕迹
