    !EnableCluster 分工，其 rust 落点在 wnode 基座 cluster 句柄判据与 wcpr::purge_outdated
    形态契约文档）——集群形态归复制面 CheckpointStore 读者闸门（delete_outdated_checkpoints 逐 token
    wcpr::purge_checkpoint）、单机形态归检查点内核尾段按代 回收（第 7 步），两条均不落在本 C# 函数面（原 wnode
    run_post_checkpoint_cleanup 无条件双轨已整体退役）
