    create_or_recreate_under_exclusive（:375 recreate_index_locked 直建，无独立谓词）；:556
    ReadForDeleteVectorIndex 全仓 rust 零引用；VectorManager.Filter.cs:266
    EvaluateCandidateFilter 为传给 C ABI 的候选过滤回调（未接线面），rust 后过滤统一走
    wnode/src/resp/vector/vector_manager_filter.rs:21 apply_post_filter；
    VectorManager.ContextMetadata.cs:789 GetContextState 仅测试检视用，rust 无对应物
