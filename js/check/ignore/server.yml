- 文件:
    - libs/server/Lua/ScriptHashKey.cs:
        - CopyTo
  理由: C# 专属机制：ScriptHashKey 是裸指针视图（long* ptr），CopyTo 只服务于「把栈上摘要复制进 pinned
    堆数组，才能入长生命周期字典」的生命周期弥合（SessionScriptCache.cs:TryLoad、
    LuaCommands.cs:TryEVAL/NetworkScriptLoad 三处调用点皆为此形态）；rust 移植为内嵌 [u8; 40]
    定长缓冲的 Copy 值类型，insert(*digest) 值复制即完成同一语义，全仓无
    「摘要写入外部定长缓冲」的生产消费点，纯测试出口随用例一并删除
