    getter 仅测试消费且与生产口径漂移（AOF 基目录 C# 用 AppendOnlyFileBaseDirectory 而旧 getter 误借
    checkpoint_base_directory_str），按不向下兼容、 路径 getter 只留一套轨删除并登记为 rust 缺口。已实现者不入
    ignore：TryParseSize→wconf/src/size.rs:63、
    ParseSize→size.rs:22、PrettySize→size.rs:112。
