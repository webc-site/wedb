- 理由: >-
    WaitForCommitToAofAsync/ReplayAOF 为抽象声明，rust
    不设第二落点，唯一实现锚挂 wnode
    single_database_manager.rs（wait_for_commit_to_aof
    / replay_aof）；RecoverAOFAsync 与
    RecoverDatabaseAOFAsync 折叠进 wnode/src/service.rs
    open_recovered_with_config_and_aof
    恢复装配（aof.log().recover_async() 设备面恢复 +
    mgr.replay_aof(u64::MAX) 全量重放）
  文件:
    - libs/server/Databases/DatabaseManagerBase.cs:
        - WaitForCommitToAofAsync
        - RecoverAOFAsync
        - ReplayAOF
        - RecoverDatabaseAOFAsync
