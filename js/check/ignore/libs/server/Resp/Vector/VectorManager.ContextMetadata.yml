- 理由: |-
    BeginFlush/FlushGuard 刻意不移植：C# 语义有二，其一「清库窗口」互斥——
    包住 DatabaseManagerBase.FlushDatabase 内 ShiftBeginAddress 物理截断窗，
    rust wkv flush_database/flush_namespace 为 O(1) 虚拟换号（lock_dbmeta
    锁内单格 CAS 换指 <1μs + DbMeta 原子批，旧域延时 GC，会话纪元防脏写），
    无物理截断窗口可包；其二「截断后重置上下文空间」——rust 由
    reclaim_registry/reclaim_registry_domain 域精确回收承接（主端 flush 四臂
    与 AOF 重放三臂共用）。且 C# 每库一个 VectorManager，全清范围天然限库；
    rust VectorManager 进程级单例（共享单日志多库），全局重置会抹掉他库存活
    上下文位，接线即错（task/ing/design-dangling-links.md 条目2，路径 B）
  文件:
    - libs/server/Resp/Vector/VectorManager.ContextMetadata.cs:
        - AllocateTestContexts
        - ExtractContextFromNamespaces
        - StoreContextInNamespace
        - BeginFlush
        - FlushGuard
