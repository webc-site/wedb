# C# 扫描迭代器纪元异常注入测试；rust 等价覆盖于 whlog scan/epoch 测试组
# （FrameClaim 释放路径经 epoch bump 抛错验证），测试脚手架（PopulateRecordSizeInfo/
# AllocatePage/FreePage/QueuePoison* 等）为 C# FlakyDevice 专用装置，无 rust 对应物
fn:
  - PopulateRecordSizeInfo
  - AllocatePage
  - FreePage
  - ClaimFrameAndIssueRead
  - AsyncReadPageFromDeviceToFrame
  - RunBounded
  - DrainIgnoringQueuedFailures
  - DrainAndDispose
  - QueuePoisonFromOtherThread
test:
  - FrameClaimIsReleasedWhenEpochBumpThrows
  - FrameClaimIsReleasedWhenEpochBumpThrowsBeforeRegistration
  - FrameClaimIsReleasedWhenIssuingTheReadThrows
  - FrameLoadSucceedsWhenEpochBumpDoesNotThrow
