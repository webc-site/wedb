  理由: C# 分配器基类整面（页分配/循环冲刷读缓冲/恢复页扫描/只读升格与阻塞截断）；rust 页生命周期单点在 whlog——循环页帧在
    whlog/src/buffer.rs CircularPageBuffer，冲刷调度在 flush.rs
    PendingFlushList，恢复扫描并入 wcpr 恢复流，能力整体承接后无逐函数转写面；ShiftAddressesWithWait
    的组合等待原语亦全在 whlog（shift_read_only_address_with_wait / shift_head_address /
    wait_safe_head_drained），C# 唯一消费面 LogSizeTracker 修剪编排在 rust 无对位，组合壳无生产调用点不转写
