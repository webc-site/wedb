    wkv/tests（store/crud、ttl、gc、etag_port、capacity），reviv 在 wreviv/tests 与
    wkv/tests/store/reviv.rs，缓冲池在 wbase/tests，检查点状态机在 wcpr/tests/cpr，纪元在
    wepoch/tests；CancellationTests 取消语义按 rust future drop 即取消（无挂起回调面）豁免；
    SharedDirectoryTests 双实例共享日志目录属 C# 部署形态，rust 按 db 隔离目录设计 （SegmentedDevice
    单库单文件生命周期）不适用
