- 文件:
    - libs/native/bftree-garnet/NativeBfTreeMethods.cs:
        - bftree_drop
  理由: C# P/Invoke 原生动态库导入声明，Rust 原生直接依赖并调用 bf_tree crate，由 Drop trait 自动释放，无需 FFI
