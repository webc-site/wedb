- 文件:
    - modules/RoaringBitmap/RoaringBitmapObject.cs:
        - CloneObject
        - Dispose
        - RoaringBitmapObject
        - Scan
  理由: CloneObject 为 C# ICustomObject 快照克隆面（rust 对象以 wcol 信封整体
    obj_encode/obj_decode 复制）；Dispose 与 Scan 在 C# 侧本身即空桩 （Dispose 全托管无资源、Scan
    注释明示恒返回空的诊断占位），rust Drop 即 回收、不设空诊断桩
