[package]
name = "wedb_standalone"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wedb_standalone"
description = "Standalone server foundation: RESP protocol, AOF logic layer, and node service orchestration"
keywords = ["server", "database", "resp", "redis", "aof"]
categories = ["database-implementations", "network-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dependencies]
bitflags = "2.13.1"
fastrand = "2.5.0"
gxhash = "3"
hdrhistogram = "7"
log = "0.4"
num_enum = "0.7.6"
parking_lot = "0.12"
sha1_smol = "1"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dependencies.async-lock]
workspace = true

[dependencies.coarsetime]
workspace = true

[dependencies.compio]
workspace = true

[dependencies.itoa]
workspace = true

[dependencies.jsonwebtoken]
version = "11.0.0"
default-features = false
features = [ "rust_crypto", "use_pem" ]

[dependencies.mlua]
version = "0.12.1"
features = [ "luau" ]

[dependencies.serde]
version = "1.0.229"
features = [ "derive" ]

[dependencies.sonic-rs]
workspace = true

[dependencies.waof]
workspace = true

[dependencies.wdev]
workspace = true

[dependencies.whasher]
version = "0.1.6"
path = "../../embed/whasher"

[dependencies.wkv]
workspace = true

[dependencies.wobject]
workspace = true

[dependencies.wresp]
workspace = true

[dependencies.wbase]
workspace = true
features = [ "convert", "ascii", "num", "hash_slot", "hash", "crc64", "glob" ]

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"

[dev-dependencies.compio]
workspace = true

[dev-dependencies.tempfile]
workspace = true

[lints]
workspace = true
