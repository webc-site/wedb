[package]
name = "wacl"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wacl"
description = "wacl"
keywords = []
categories = []

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitflags = "2.13.2"
gxhash = "3.5.0"
parking_lot = "0.12.5"
sha2 = "0.11.0"
thiserror = "2.0.20"
whasher = { version = "0.1.5", path = "../../embed/whasher" }
wresp = { version = "0.1.0", path = "../wresp" }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"

[lints]
workspace = true
