name: Cache GC

# Cargo 编译缓存的主动回收：rust-cache 每次构建没命中就存一份新键，旧的那份它自己不删，
# 4 个镜像 × 5 个引擎列很快把仓库 10 GiB 配额堆满，之后由 GitHub 的 LRU 无差别踢——
# 被踢的往往正是刚编热的那族，冷编译重来一次就是 rocksdb 那种几十分钟的 C++ 源码构建。
# 所以这里按年龄自己清：last_accessed_at 早于闸口的就是真冷了，直接删；
# 还在用的必然刚被 restore 打过访问点，动不到。
#
# 手动触发可以先 dry_run 看清单，确认了再放开；key_filter 只删 key 含此子串的族
# （例如 `bench-` 或 `test-wedb`），留空 = 全仓缓存按年龄一把扫。

on:
  schedule:
    # 每天 03:30 UTC：避开各站跑测高峰，也不和 GitHub 自己的清理节奏挤在一起
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 多久没被访问算过期
        required: false
        default: "5"
        type: string
      key_filter:
        description: 只删 key 含此子串的缓存（留空 = 全部）
        required: false
        default: ""
        type: string
      dry_run:
        description: 只列清单不删
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  # 两把扫同时跑会各自拿到同一份清单去删，第二次全踩在已消失的 id 上；
  # 上一轮没扫完就排队，不中途取消
  group: cache-gc
  cancel-in-progress: false

jobs:
  gc:
    name: 按年龄回收 Cargo 缓存
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scan and evict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.older_than_days || '5' }}
          KEY_FILTER: ${{ github.event.inputs.key_filter || '' }}
          # schedule 触发没有 inputs（布尔项在 github.event.inputs 里就是字符串），必须真删；
          # 手动触发听 dry_run 的
          DRY: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run == 'true' && 'true' || 'false') }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          api="/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100"
          echo "闸口：last_accessed_at 早于 ${cutoff}（${DAYS} 天）判为过期，dry_run=${DRY}"

          # 一次拉全量（--paginate 跨页拼平），后面所有口径都从这份 TSV 上算，
          # 免得对同一个 API 反复请求；ISO-8601 时间戳直接按字典序比较即可
          all=$(gh api "$api" --paginate --jq \
            '.actions_caches[] | [.id, .size_in_bytes, .last_accessed_at, .key] | @tsv')
          total_count=$(printf '%s\n' "$all" | grep -c . || true)
          total_mib=$(printf '%s\n' "$all" | awk -F'\t' '{ s += $2 } END { printf "%d", s / 1048576 }')
          echo "配额现状：${total_count} 个缓存，合计 ${total_mib} MiB" | tee -a "$GITHUB_STEP_SUMMARY"

          # cutoff 由 date 现算，不含人输入；key_filter 是输入项，
          # 只在 bash 侧用 grep -F 字面匹配，不进 jq/awk 脚本
          rows=$(printf '%s\n' "$all" | awk -F'\t' -v c="$cutoff" '$3 < c')
          if [ -n "$KEY_FILTER" ]; then
            rows=$(printf '%s\n' "$rows" | grep -F -- "$KEY_FILTER" || true)
          fi
          if [ -z "${rows//[[:space:]]/}" ]; then
            echo "没有过期缓存，配额已经很干净。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| 缓存 key | 大小 | 最后访问 | 动作 |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          freed=0
          count=0
          while IFS=$'\t' read -r id size accessed key; do
            [ -n "$id" ] || continue
            count=$((count + 1))
            mib=$((size / 1024 / 1024))
            if [ "$DRY" = "true" ]; then
              echo "| \`$key\` | ${mib} MiB | $accessed | 待删（dry-run） |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # 删失败（GitHub 已自己收走、id 不在了）只记一行，不整轮红
            if gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null 2>&1; then
              freed=$((freed + size))
              echo "| \`$key\` | ${mib} MiB | $accessed | 已删 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$key\` | ${mib} MiB | $accessed | 删除失败，跳过 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$rows"

          note="未删除任何缓存（dry-run 清单）"
          [ "$DRY" = "false" ] && note="已删除"
          echo "本轮命中 ${count} 个过期缓存，释放 $((freed / 1024 / 1024)) MiB（${note}）。" \
            | tee -a "$GITHUB_STEP_SUMMARY"
