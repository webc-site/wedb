name: rust-test (reusable)

# 可复用工作流：给 wedb / node / cluster / regress 各自的 test workflow 使用。
# 在 CI 上不直接调用 ./test.sh（它依赖本机私有 cargo_sh 的 sh/env.sh），
# 而是用公共 action 搭建等价环境，并执行与对应 test.sh 相同的测试命令：
#   cargo nextest run --all-features
# 想跑哪个组件的 test.sh, 用 with.dir 传入组件目录即可。

on:
  workflow_call:
    inputs:
      dir:
        description: 组件目录 (wedb | node | cluster | regress)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-test-${{ inputs.dir }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test · ${{ inputs.dir }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # Linux x86_64
          - ubuntu-24.04-arm # Linux aarch64
          - windows-latest # Windows x86_64
          - macos-latest # macOS aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # gxhash 要求 AES 指令集 (与 sh/env.sh 保持一致；aarch64 上 aes 属基线
      # 特性，重复开启无副作用)，否则 x86_64 全新构建触发 gxhash compile_error
      RUSTFLAGS: -C target-feature=+aes
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # @stable 每次解析当时最新的稳定版；把实际版本打进日志，
      # 红灯要和编译器版本一起看（新版本可能带来新的 lint/优化退化）
      - name: Toolchain version
        run: rustc -vV && cargo -V

      - uses: Swatinem/rust-cache@v2
        with:
          # 仓库无根 Cargo.toml：wedb / node / cluster / regress 各自独立 workspace，
          # 缓存须指向对应组件目录，否则保存缓存时 cargo metadata 在仓库根失败
          workspaces: ${{ inputs.dir }}
          cache-on-failure: true
          # 一个组件一族缓存（key 是 rust-cache 加在自动 job 级键上的额外标识），
          # 缓存列表里按 `test-<dir>` 认领；4 组件 × 4 镜像已经贴着 10 GiB 配额，
          # 攒旧的过期整族由 cache-gc.yml 按年龄回收
          key: test-${{ inputs.dir }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (${{ inputs.dir }})
        run: cargo nextest run --all-features
        working-directory: ${{ inputs.dir }}
