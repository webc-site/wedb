name: Benchmark

# redb 同构评测：一次推 main = 4 个 runner 镜像（Linux x64 / Linux arm64 / macOS arm64 /
# Windows x64）× 5 个引擎列的矩阵。每列一个 job，按 feature 单独编译，所以某列崩溃、
# 超时甚至构建失败都只让那一格折成 N/A，其余列照常出表；汇总 job 把各列机读结果
# 并成平台表写进 Job Summary，并把 report.json 作为产物上传。
#
# 站点发布排在「对比 + 回归」之后：两个 job 都绿了才重建 gh-pages（见 website.yml）。

on:
  push:
    branches:
      - main
    # 文档、站点、任务笔记的改动不影响被测代码路径，不重跑冷编译基准
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "readme/**"
      - "task/**"
      - "website/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/website.yml"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      scale:
        description: 负载缩放（1.0 = redb 标准档：5M 装载 / 1M 有序 / 24B 键 / 150B 值；冒烟可填 0.02）
        required: false
        default: "1.0"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark-${{ github.ref }}
  # 主分支上的每一轮都要跑完并沉淀历史，不中途取消
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bench:
    name: ${{ matrix.engine }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux-x64
          - ubuntu-24.04-arm # linux-arm64
          - macos-latest # macos-arm64
          - windows-latest # windows-x64
        engine:
          - hash
          - bftree
          - fjall
          - rocksdb
          - sqlite
    # 最慢的格子是 rocksdb（要从源码编 RocksDB C++ 再跑满 5M 装载）：
    # 编译 + 单引擎墙钟预算 3600s，留足余量
    timeout-minutes: 150
    env:
      # 覆盖 bench/.cargo/config.toml 的本地 target-dir，让 rust-cache 能命中
      CARGO_TARGET_DIR: ${{ github.workspace }}/bench/target
      # gxhash 要求 AES 指令集（与 rust-test.yml、sh/env.sh 同口径；arm64 上是基线特性）
      RUSTFLAGS: -C target-feature=+aes
      ENGINE: ${{ matrix.engine }}
      SCALE: ${{ github.event.inputs.scale || '1.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
          cache-on-failure: true

      # librocksdb-sys 的 build.rs 无条件跑 bindgen，需要 libclang；其余列不引原生依赖
      - name: Install libclang (Linux · rocksdb)
        if: matrix.engine == 'rocksdb' && startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Install LLVM (Windows · rocksdb)
        if: matrix.engine == 'rocksdb' && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Point bindgen at LLVM (Windows · rocksdb)
        if: matrix.engine == 'rocksdb' && startsWith(matrix.os, 'windows')
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Point bindgen at Xcode libclang (macOS · rocksdb)
        if: matrix.engine == 'rocksdb' && startsWith(matrix.os, 'macos')
        run: |
          p=/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib
          if [ -d "$p" ]; then echo "LIBCLANG_PATH=$p" >> "$GITHUB_ENV"; fi

      - name: Bench ${{ matrix.engine }}
        shell: bash
        run: |
          mkdir -p bench/.bench_run
          # 必须用 --bench 锁定 bench 目标：cargo bench 默认把参数也喂给 lib 单测目标，
          # libtest 不认 --only 会以 101 退出，整列凭空失败
          cargo bench -p wedb-bench-compare --no-default-features \
            --features "$ENGINE" --bench compare_benchmark -- \
            --only "$ENGINE" --scale "$SCALE" \
            --json "$GITHUB_WORKSPACE/bench/.bench_run/run.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/bench/.bench_run/bench.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload column result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-run-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            bench/.bench_run/run.json
            bench/.bench_run/bench.log
          retention-days: 14
          if-no-files-found: warn

  report:
    name: 汇总平台表
    needs: bench
    # 单列 job 失败也要出表：缺的格子由 benchreport merge --expect 补成整列 N/A
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/bench/target
      RUSTFLAGS: -C target-feature=+aes
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
          cache-on-failure: true

      - name: Download column results
        uses: actions/download-artifact@v7
        with:
          path: bench-results
          pattern: bench-run-*
          merge-multiple: false

      - name: Build benchreport
        run: cargo build -p wedb-bench --no-default-features --release --bin benchreport

      - name: Merge into platform tables
        shell: bash
        run: |
          set -euo pipefail
          runs=$(find bench-results -name run.json | sort)
          if [ -z "$runs" ]; then
            echo "所有评测 job 都没有产出机读结果，汇总终止。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bench/target/release/benchreport merge \
            --out report.json \
            --markdown summary.md \
            --expect hash,https://github.com/webc-site/wedb/tree/main/wedb/wkv \
            --expect bftree,https://github.com/webc-site/wedb/tree/main/wedb/wbftree \
            --expect fjall,https://github.com/fjall-rs/fjall \
            --expect rocksdb,https://github.com/rust-rocksdb/rust-rocksdb \
            --expect sqlite,https://github.com/rusqlite/rusqlite \
            $runs
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh README bench tables
        # 只在主分支推送那轮回写：workflow_dispatch 的手动冒烟档（0.02×）不该污染 README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node js/readme.js --report report.json --tables summary.md --skip-missing
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "本轮没有代表平台（linux-arm64）的结果，README 保持原样。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md readme/
          if git diff --cached --quiet; then
            echo "README 表格数字没有变化，不回写。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "README 评测表刷新（${GITHUB_SHA:0:7}）[skip ci]"
          git push origin HEAD:main
          echo "README 评测表已回写 main（${GITHUB_SHA:0:7}）" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report
        uses: actions/upload-artifact@v7
        with:
          name: wedb-bench-report
          path: |
            report.json
            summary.md
          retention-days: 30

  regression:
    name: 回归测试 · regress
    uses: ./.github/workflows/rust-test.yml
    with:
      dir: regress

  website:
    name: 站点构建发布
    needs: [report, regression]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/website.yml
    with:
      report-artifact: wedb-bench-report
    secrets: inherit
