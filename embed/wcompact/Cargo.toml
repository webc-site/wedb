[package]
name = "wcompact"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb_base.git"
homepage = "https://github.com/webc-site/wedb_base/tree/main/wcompact"
description = "wcompact"
keywords = []
categories = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dependencies]
wbase = { workspace = true, features = ["time"] }
log = { workspace = true }
thiserror = { workspace = true }
wdev = { workspace = true }
wepoch.workspace = true
whasher = { workspace = true }
whlog = { workspace = true }
windex = { workspace = true }
wrecord = { workspace = true }
wval = { workspace = true }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies.compio]
workspace = true
features = ["runtime"]

[lints]
workspace = true
