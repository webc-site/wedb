[package]
name = "whlog"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb"
homepage = "https://github.com/webc-site/wedb"
description = "HybridLog allocator with three-region sliding window and scan iterator / 混合日志分配器，含三区滑动窗口与扫描迭代器"
keywords = ["hybridlog", "allocator", "storage-engine", "circular-buffer", "log"]
categories = ["database-implementations", "data-structures", "concurrency", "asynchronous", "memory-management"]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitcode = { workspace = true }
itoa = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
wdev = { workspace = true }
wepoch = { workspace = true }
wram = { workspace = true }
wrecord = { workspace = true }
zmij = { workspace = true }

[dependencies.compio]
workspace = true
features = ["runtime", "time"]

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }
tempfile = { workspace = true }
whasher = { workspace = true }

[lints]
workspace = true
