[package]
name = "wram"
version = "0.1.4"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wram"
description = "Direct virtual memory and native allocation tracking for async storage; sector-aligned buffer pool re-exported from wutil / 异步存储直接虚拟内存与原生分配追踪，扇区对齐缓冲池本体已下沉 wutil"
keywords = ["buffer-pool", "memory-pool", "sector-aligned", "async-io", "storage"]
categories = [
  "memory-management",
  "concurrency",
  "asynchronous",
  "database-implementations",
  "filesystem",
]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libc = { workspace = true }
log = { workspace = true }
wbase = { workspace = true, features = ["align", "striped", "thread", "pool"] }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }

[lints]
workspace = true
