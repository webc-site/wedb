[package]
name = "wram"
version = "0.1.3"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb"
homepage = "https://github.com/webc-site/wedb"
description = "Sector-aligned buffer pool and direct virtual memory for async storage / 面向异步存储的扇区对齐缓冲池与直接虚拟内存"
keywords = ["buffer-pool", "memory-pool", "sector-aligned", "async-io", "storage"]
categories = [
  "memory-management",
  "concurrency",
  "asynchronous",
  "database-implementations",
  "filesystem",
]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio-buf = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
wbase = { workspace = true, features = ["align", "striped", "thread"] }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }

[lints]
workspace = true
