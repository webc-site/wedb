[package]
name = "whasher"
version = "0.1.5"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/whasher"
description = "Hardware-accelerated hashing, streaming checksums, and concurrent collections / 硬件加速哈希、流式校验和与并发集合"
keywords = ["hash", "gxhash", "checksum", "concurrent", "collections"]
categories = ["algorithms", "data-structures", "concurrency", "caching", "database-implementations"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gxhash = { workspace = true }
papaya = { workspace = true }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log_init = { workspace = true }

[lints]
workspace = true
