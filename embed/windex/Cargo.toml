[package]
name = "windex"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb"
homepage = "https://github.com/webc-site/wedb"
description = "Lock-free fixed-capacity hash index with overflow bucket pool / 无锁定容哈希索引，含溢出桶池"
keywords = ["hash-index", "lock-free", "hash-table", "storage-engine", "concurrency"]
categories = ["database-implementations", "data-structures", "concurrency", "algorithms", "memory-management"]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = { workspace = true }
wbase = { workspace = true, features = ["addr"] }
whasher = { workspace = true }
wram = { workspace = true }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }

[lints]
workspace = true
