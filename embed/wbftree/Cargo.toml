[package]
name = "wbftree"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb"
homepage = "https://github.com/webc-site/wedb"
description = "BfTree ordered range index with multi-tree registry and chunked migration / BfTree 有序范围索引，含多树注册表与分块迁移"
keywords = ["bftree", "range-index", "ordered-index", "storage-engine", "key-value"]
categories = ["database-implementations", "data-structures", "asynchronous", "caching", "concurrency"]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bf-tree = { workspace = true }
fastrand = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
wbase = { workspace = true, features = ["align", "backoff", "base32", "striped", "time"] }
whasher = { workspace = true }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
fastrand = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }

[dev-dependencies.compio]
workspace = true
features = ["time"]

[lints]
workspace = true
