[package]
name = "wepoch"
version = "0.1.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wepoch"
description = "LightEpoch epoch protection for safe memory reclamation / 面向安全内存回收的纪元保护"
keywords = ["epoch", "smr", "lock-free", "memory-reclamation", "concurrency"]
categories = ["concurrency", "memory-management", "data-structures", "database-implementations", "algorithms"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
wbase = { workspace = true, features = ["backoff", "thread"] }
whasher = { workspace = true }

[dev-dependencies]
aok = { workspace = true }
ctor = { workspace = true }
log_init = { workspace = true }
parking_lot = { workspace = true }
wram.workspace = true

[lints]
workspace = true
