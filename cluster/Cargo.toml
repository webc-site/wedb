[workspace]
resolver = "3"
members = [ "wraft", "wedb", "wcluster" ]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/webc-site/wedb.git"

[workspace.dependencies]
thiserror = "2.0.20"

  [workspace.dependencies.wraft]
  version = "0.1.0"
  path = "wraft"

  [workspace.dependencies.wedb_standalone]
  path = "../node/wedb_standalone"
  version = "0.1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
