[package]
name = "bench"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/bench"
description = "bench"
keywords = []
categories = []

[features]
default = ["redb", "fjall", "rocksdb", "sqlite", "wbftree", "wkv"]
redb = ["dep:redb"]
fjall = ["dep:fjall"]
rocksdb = ["dep:rocksdb"]
sqlite = ["dep:rusqlite"]
wbftree = ["dep:wbftree"]
wkv = ["dep:wkv", "dep:wdev", "dep:compio"]
wdev = ["dep:wdev"]
compio = ["dep:compio"]
rusqlite = ["dep:rusqlite"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio = { version = "0.19.2", features = ["runtime", "time"], optional = true }
fastrand = "2.5.0"
fjall = { version = "3.1.10", optional = true }
gxhash = "3.5.0"
itoa = "1.0.18"
libc = "0.2.189"
mimalloc = "0.1.52"
redb = { version = "4.2.0", optional = true }
rocksdb = { version = "0.25.0", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sonic-rs = "0.5.8"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.20"
walkdir = "2.5.0"
wbftree = { version = "0.1.4", path = "../../wedb/wbftree", optional = true }
wdev = { version = "0.1.3", path = "../../wedb/wdev", optional = true }
wkv = { version = "0.1.1", path = "../../wedb/wkv", optional = true }

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log = "0.4.34"
log_init = "0.1.39"

