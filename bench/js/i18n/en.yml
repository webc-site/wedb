notes: Performance metrics display relative multiplier in the first line (baseline 1.00X for lowest performance, higher is better) and disk throughput in the second line. Random reads and range scans report median of 3 runs. Cache sizes are configured uniformly where applicable. All write sections except nosync perform durable per-transaction fsync; the nosync section disables per-commit fsync via set_sync(false) and restores durable writes afterwards. The total-records (len) row mixes counting semantics — rocksdb/sqlite/fjall count via full-table or LSM iterator scans, wkv counts via an in-memory hash-index bucket-chain scan, while redb/wbftree read a metadata counter directly; multipliers on this row reflect counting-semantics differences, not engine performance, and must not be read as a performance conclusion. All write sections (bulk load, individual writes, batch writes, nosync, removals) are timed once each with no warmup discard window and no repeated sampling, so the figures include first-touch page-fault and cold-cache effects and are not reproducible means. The wbftree uncompacted-size row uses a page-level write-through caliber with no explicit flush step (upstream bf-tree exposes no page-pool drain API); its size is permanently underreported by a sub-0.2% buffer-tail residue relative to a fully solidified snapshot image, a constant that does not scale with dataset size — interpret cross-engine comparisons accordingly.
