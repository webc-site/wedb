notes: 性能指标第一行为相对倍数（以同项最低性能为 1.00X 基准，越大越优），第二行为实际磁盘吞吐；随机点查与范围扫描取 3 次运行中位数；各引擎缓存大小尽可能统一配置；写入段落除 nosync 外均为逐事务 fsync 持久写，nosync 段经 set_sync(false) 关闭逐笔 fsync 评测异步吞吐，段后恢复默认持久写。记录总数（len）行为跨语义混排行——rocksdb/sqlite/fjall 为全表或 LSM 迭代扫描计数，wkv 为内存哈希索引逐桶逐链扫描计数，redb/wbftree 为元数据计数直读，该行倍数反映计数口径差异而非引擎性能差异，不可作性能结论。写入各段（批量导入、单条逐笔、事务批量、nosync、删除）均为单次计时，无预热丢弃窗口与重复采样，数字含首次页错误与冷缓存影响，非可复现均值。wbftree 的整理前磁盘占用行为页级写穿口径、无独立 flush 步骤（上游 bf-tree 无公开页池排空接口），相对全固化快照影像恒有 <0.2% 的缓冲尾残留偏小，该量级恒定、不随数据规模放大，横比时按此口径理解。
