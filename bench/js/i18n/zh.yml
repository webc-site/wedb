params_desc_title: 配置参数与统计说明
params_desc:
  - label: 键值规格
    desc: 24B 键 / 150B 值，二进制键与结构体载荷。
  - label: 缓存预算
    desc: 统一配置 128 MiB，统筹约束各引擎读缓存 (Block Cache)、缓冲池与写缓冲 (MemTable)。
  - label: 负载规模
    desc: 全量导入 6,000,000 条记录 (~1.04 GiB 原始写入)，数据量超出内存缓存 10~30 倍。
  - label: 写入场景
    desc: 默认逐事务持久写（commit 触发 fsync，对标 redb-bench 上游默认 sync=true）；评测单条逐笔、事务批量 (1,000条/批)，另设 nosync 段关闭逐笔 fsync 对比异步吞吐，段后恢复持久写。
  - label: 查询测试
    desc: 随机点查 100,000 项，范围扫描 5,000 次 (步长 10)，多线程覆盖 4~32 线程，取 3 轮中位数。
  - label: 空间与内存
    desc: 磁盘统计落盘与紧缩后大小；内存记录测试完成后的常驻物理内存 (RSS / Footprint)。
durability_title: 存储架构与持久化说明
durability_desc: >-
  基准规范：各引擎默认逐事务持久写（对标 redb-bench 上游默认 `sync = true`，每次 commit 触发物理 fsync）；仅 nosync 段经 `set_sync(false)` 关闭逐笔 fsync 评测异步吞吐，段后恢复默认持久写。sqlite 的 nosync 映射 `synchronous = OFF`（完全不 fsync），与 redb `Durability::None` 同口径。
durability_col_engine: 引擎
durability_col_arch: 存储架构
durability_col_sync: 默认事务持久化
durability_col_bulk: 批量导入持久化
durability_col_nosync: nosync 段口径 (set_sync(false))
durability_col_verify: 数据校验与一致性
durability_li:
  - engine: wkv
    url: https://github.com/webc-site/wedb/tree/main/wedb/wkv
    arch: Append-Only 混合日志环形缓冲 (HybridLog 内存环形页 + 分段文件存储)
    sync: 默认持久写，每次 commit 执行 flush_all 强制设备物理 sync，逐事务硬件落盘
    bulk: 环形缓冲区流式流水线换页，最终 commit 一次 flush_all 与设备物理 sync
    nosync: 仅写 HybridLog 环形页与日志缓冲，commit 不触发 flush，满页后台流水线分段落盘
    verify: CRC32 全包校验 + Epoch 安全无锁并发保护
  - engine: wbftree
    url: https://github.com/webc-site/wedb/tree/main/wedb/wbftree
    arch: 缓存页缓冲池 (Cache-Buffer B-Tree 架构)
    sync: 写入 Cache-Buffer 页缓冲，脏页以页为单位即时回写工作文件（页级写穿），不逐笔调用硬件 fsync
    bulk: 批量导入随写以页为单位回写落盘，结束无统一 flush 步骤（上游 bf-tree 无公开页池排空接口），仅尾部数个 mini 页常驻不回写
    nosync: 不支持 set_sync 切换，该段回退默认写并记 N/A
    verify: 页面级 CRC32 校验 + Snapshot 只读隔离
  - engine: redb
    url: https://github.com/cberner/redb
    arch: 写时复制 B-Tree (Copy-on-Write / MVCC)
    sync: 默认持久写 (redb 默认 Durability)，每次 commit 阻塞执行操作系统物理 fsync
    bulk: 单次大事务批量写入，最终 commit 一次 fsync
    nosync: Durability::None，commit 跳过 fsync，数据仅写入操作系统内核缓存
    verify: 内置页面校验和 + ACID 事务崩溃一致性
  - engine: fjall
    url: https://github.com/fjall-rs/fjall
    arch: 单写者 LSM-Tree 架构
    sync: 默认持久写 (PersistMode::SyncAll)，每次 commit 阻塞执行磁盘物理 fsync
    bulk: 单写者事务流式追加，仅在全量写入完成后的最终 commit 执行一次物理 fsync
    nosync: PersistMode::Buffer，仅写 WAL 内存/内核缓冲，不调用磁盘物理 fsync
    verify: 数据块 CRC32 校验和 + WAL 崩溃安全恢复
  - engine: rocksdb
    url: https://github.com/facebook/rocksdb
    arch: LSM-Tree + 原生 WriteBatch 批量提交
    sync: 默认持久写 (WriteOptions sync=true)，每次 commit 强制 WAL 物理 fsync
    bulk: WriteBatch 流式分批写入，全量写入完成后的最终 commit 触发落盘并同步
    nosync: WAL 写入不 fsync，仅操作系统内核缓冲
    verify: SSTable 数据块与 WAL 内置 Checksum 校验
  - engine: sqlite
    url: https://www.sqlite.org
    arch: 标准 B-Tree + 预写日志 (WAL 模式)
    sync: 默认持久写 (PRAGMA synchronous = FULL)，每次 commit 强制 WAL 硬件物理 fsync
    bulk: 单次大事务批量插入，最终 commit 落盘，全量完成后通过 wal_checkpoint(TRUNCATE) 刷盘
    nosync: PRAGMA synchronous = OFF，完全不 fsync，与 redb Durability::None 同口径
    verify: 页面级校验 + WAL 事务原子性与断电回滚保证
