[workspace]
resolver = "3"
members = [
  "example",
  "ext_json",
  "ext_noop",
  "ext_roaring",
  "wacl",
  "waof",
  "wbase",
  "wbftree",
  "wcol",
  "wcompact",
  "wconn",
  "wcpr",
  "wdev",
  "wedb",
  "wedb_standalone",
  "wepoch",
  "whasher",
  "whlog",
  "windex",
  "wkv",
  "wlua",
  "wnode", "wpubsub",
  "wram",
  "wrecord",
  "wresp",
  "wreviv", "wtxn",
  "wval",
]

[workspace.dependencies]
async-lock = "3.4.2"
bf-tree = "0.5.6"
bitcode = "0.6.9"
bitflags = "2.13.1"
coarsetime = "0.1.37"
compio = "0.19.2"
compio-buf = "0.8.3"
crc32fast = "1.5.1"
event-listener = "5.4.2"
fastrand = "2.5.0"
gxhash = "3.5.0"
itoa = "1.0.18"
libc = "0.2.189"
log = "0.4.34"
papaya = "0.2.5"
parking_lot = "0.12.5"
serde = "1.0.229"
sha1_smol = "1"
smallvec = "1.16.0"
sonic-rs = "0.5.8"
strum = "0.28.0"
thiserror = "2.0.20"
zmij = "1.0.23"
aok = "0.1.18"
ctor = "1.0.13"
log_init = "0.1.39"
tempfile = "3.27.0"

[workspace.dependencies.wbase]
version = "0.1.5"
path = "wbase"

[workspace.dependencies.wbftree]
version = "0.1.4"
path = "wbftree"

[workspace.dependencies.wcompact]
version = "0.1.2"
path = "wcompact"

[workspace.dependencies.wcpr]
version = "0.1.2"
path = "wcpr"

[workspace.dependencies.wdev]
version = "0.1.3"
path = "wdev"

[workspace.dependencies.wepoch]
version = "0.1.3"
path = "wepoch"

[workspace.dependencies.whasher]
version = "0.1.6"
path = "whasher"

[workspace.dependencies.whlog]
version = "0.1.3"
path = "whlog"

[workspace.dependencies.windex]
version = "0.1.2"
path = "windex"

[workspace.dependencies.wram]
version = "0.1.5"
path = "wram"

[workspace.dependencies.wrecord]
version = "0.1.3"
path = "wrecord"

[workspace.dependencies.wreviv]
version = "0.1.2"
path = "wreviv"

[workspace.dependencies.wval]
version = "0.1.2"
path = "wval"

[workspace.dependencies.wacl]
version = "0.1.1"
path = "wacl"

[workspace.dependencies.waof]
version = "0.1.2"
path = "waof"

[workspace.dependencies.wconn]
version = "0.1.1"
path = "wconn"

[workspace.dependencies.wkv]
version = "0.1.1"
path = "wkv"

[workspace.dependencies.wlua]
version = "0.1.0"
path = "wlua"

[workspace.dependencies.wresp]
version = "0.1.1"
path = "wresp"

[workspace.dependencies.wcol]
version = "0.1.0"
path = "wcol"

[workspace.dependencies.futures-util]
version = "0.3.34"
default-features = false

[workspace.lints.clippy]
arc_with_non_send_sync = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
