[workspace]
resolver = "3"
members = [
  "wext_json",
  "wext_roaring",
  "wacl",
  "waof",
  "wbase",
  "wbitmap",
  "wbftree",
  "wcol",
  "wcompact",
  "wconf",
  "wconn",
  "wcpr",
  "wcustom",
  "wdev",
  "wedb",
  "wedb_standalone",
  "wedb_test",
  "wnode_test",
  "wvector_test",
  "wtxn_test",
  "wepoch",
  "whasher",
  "whyperlog",
  "whlog",
  "windex",
  "wkv",
  "wlua",
  "wnode",
  "wmetric",
  "wpubsub",
  "wrecord",
  "wresp",
  "wreviv",
  "wtxn",
  "wval",
  "wvector", "wtest_base", "wnode_tls_test", "wtls",
]

[workspace.package]
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
edition = "2024"

[workspace.dependencies]
arc-swap = "1.9.2"
async-lock = "3.4.2"
clap = { version = "4.6.7", features = ["derive"] }
crossfire = "3.1.20"
bf-tree = "0.5.6"
bitcode = "0.6.9"
bitflags = "2.13.2"
coarsetime = "0.1.37"
compio = "0.19.2"
compio-buf = "0.8.3"
crc32fast = "1.5.2"
enum_dispatch = "0.3.13"
event-listener = "5.4.2"
fastrand = "2.5.0"
# 仓内集合统一走 wbase::map wrapper 的进程级随机种子。
gxhash = "3.5.0"
itoa = "1.0.18"
log = "0.4.34"
papaya = "0.2.5"
parking_lot = "0.12.5"
serde = "1.0.229"
sha1_smol = "1"
sha2 = "0.11.0"
smallvec = "1.16.1"
sonic-rs = "0.5.10"
rustls-pemfile = "2.2.0"
strum = "0.28.0"
thiserror = "2.0.20"
zmij = "1.0.23"
aok = "0.1.18"
ctor = "1.0.13"
log_init = "0.1.39"
tempfile = "3.27.0"
fearless_simd = "1.0.0"
num_enum = "0.7.6"
compio-tls = "0.10.0"

[workspace.dependencies.wbase]
version = "0.1.9"
path = "wbase"

[workspace.dependencies.wbitmap]
version = "0.1.1"
path = "wbitmap"

[workspace.dependencies.wbftree]
version = "0.1.6"
path = "wbftree"

# 仅 wkv 消费、版本锁定：HybridLog 日志紧缩器，对标 Tsavorite.core/Compaction
# 引擎功能组件（独立 tests 与演进面），保留 crate 编译隔离，不降级为 wkv 子模块
[workspace.dependencies.wcompact]
version = "0.1.4"
path = "wcompact"

[workspace.dependencies.wcol]
version = "0.1.1"
path = "wcol"

[workspace.dependencies.wconf]
version = "0.1.1"
path = "wconf"

[workspace.dependencies.wcpr]
version = "0.1.4"
path = "wcpr"

[workspace.dependencies.wdev]
version = "0.1.7"
path = "wdev"

[workspace.dependencies.wepoch]
version = "0.1.5"
path = "wepoch"

[workspace.dependencies.whasher]
version = "0.1.9"
path = "whasher"

[workspace.dependencies.whyperlog]
version = "0.1.0"
path = "whyperlog"

[workspace.dependencies.whlog]
version = "0.1.5"
path = "whlog"

[workspace.dependencies.windex]
version = "0.1.5"
path = "windex"

[workspace.dependencies.wmetric]
version = "0.1.0"
path = "wmetric"

[workspace.dependencies.wrecord]
version = "0.1.5"
path = "wrecord"

# 仅 wkv 消费、版本锁定：槽位复活回收池，对标 Tsavorite.core/Index/Tsavorite/
# Implementation/Revivification。引擎功能组件（独立 tests 与演进面），保留
# crate 编译隔离，不降级为 wkv 子模块
[workspace.dependencies.wreviv]
version = "0.1.2"
path = "wreviv"

[workspace.dependencies.wval]
version = "0.1.5"
path = "wval"

[workspace.dependencies.wacl]
version = "0.1.3"
path = "wacl"

[workspace.dependencies.waof]
version = "0.1.6"
path = "waof"

[workspace.dependencies.wconn]
version = "0.1.2"
path = "wconn"

[workspace.dependencies.wkv]
version = "0.1.1"
path = "wkv"

[workspace.dependencies.wlua]
version = "0.1.0"
path = "wlua"

[workspace.dependencies.wresp]
version = "0.1.4"
path = "wresp"

[workspace.dependencies.wvector]
version = "0.1.0"
path = "wvector"

[workspace.dependencies.wcustom]
version = "0.1.1"
path = "wcustom"

[workspace.dependencies.wnode]
version = "0.1.0"
path = "wnode"

[workspace.dependencies.wpubsub]
version = "0.1.0"
path = "wpubsub"

[workspace.dependencies.wtxn]
version = "0.1.2"
path = "wtxn"

[workspace.dependencies.wedb]
version = "0.1.0"
path = "wedb"

[workspace.dependencies.wedb_test]
version = "0.1.0"
path = "wedb_test"

[workspace.dependencies.wtls]
version = "0.1.0"
path = "wtls"

[workspace.dependencies.wnode_tls_test]
version = "0.1.0"
path = "wnode_tls_test"

[workspace.dependencies.wtest_base]
version = "0.1.0"
path = "wtest_base"

[workspace.dependencies.wnode_test]
version = "0.1.0"
path = "wnode_test"

[workspace.dependencies.wvector_test]
version = "0.1.0"
path = "wvector_test"

[workspace.dependencies.wtxn_test]
version = "0.1.0"
path = "wtxn_test"

[workspace.dependencies.wext_json]
version = "0.1.0"
path = "wext_json"

[workspace.dependencies.wext_roaring]
version = "0.1.0"
path = "wext_roaring"

[workspace.dependencies.futures-util]
version = "0.3.34"
default-features = false

[workspace.lints]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic 维持默认 unwind（panic-abort-policy 裁决）：撤 abort 换单会话 panic
# 隔离（C# TryConsumeMessages catch(Exception)→Dispose 对位），连接泵
# catch_unwind 兜底收场（wnode net/handler/drive.rs process_stream），
# vector cleanup 与 wbftree 回调边界的既有 catch_unwind 随之恢复生效
strip = true
overflow-checks = false

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

