[package]
name = "wlua"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/webc-site/wedb/tree/main/wlua"
description = "Lua scripting engine integration (Luau runtime) for server-side scripts"
keywords = ["lua", "luau", "scripting"]
categories = ["scripting"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
enum_dispatch.workspace = true

log.workspace = true
parking_lot.workspace = true
sha1_smol.workspace = true
sonic-rs.workspace = true
wbase = { workspace = true, features = ["convert", "num", "map", "time", "hex"] }
wresp.workspace = true

[dev-dependencies]
aok.workspace = true
ctor.workspace = true
log_init.workspace = true


[lints]
workspace = true

[build-dependencies]
luau0-src = "0.21.0"
