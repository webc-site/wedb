[package]
name = "wconn"
version = "0.1.2"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wconn"
description = "Network connection and session management: RESP protocol parser and client API"
keywords = ["network", "connection", "session", "resp"]
categories = ["network-programming", "database-implementations"]

[features]
default = []
tls = [
  "dep:compio-tls",
  "dep:rustls-pemfile",
  "dep:webpki-roots",
  "dep:futures-util",
  "wbase/tls",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio = { workspace = true, features = ["net", "io", "runtime", "time"] }
compio-tls = { version = "0.10.0", default-features = false, features = ["rustls", "ring"], optional = true }
crossfire.workspace = true
event-listener.workspace = true
futures-util = { workspace = true, features = ["bilock", "io", "unstable"], optional = true }
itoa.workspace = true
log.workspace = true
rustls-pemfile = { version = "2.2.0", optional = true }
thiserror.workspace = true
wbase = { workspace = true, features = ["endpoint", "pool"] }
webpki-roots = { version = "0.26", optional = true }
wresp.workspace = true
zmij.workspace = true

[dev-dependencies]
aok.workspace = true
ctor.workspace = true
log_init.workspace = true
tempfile.workspace = true


[lints]
workspace = true
