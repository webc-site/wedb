[package]
name = "wval"
version = "0.1.3"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wval"
description = "Redis value layer: namespace encoding, collection codecs, glob, TTL"
keywords = ["redis", "value-encoding", "codec", "collections", "zset"]
categories = ["database-implementations", "encoding", "data-structures", "algorithms", "caching"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dependencies]
thiserror = { workspace = true }
wbase = { workspace = true, features = ["buf", "float", "glob", "simd", "varint"] }

[dependencies.strum]
workspace = true
features = ["derive"]

[dev-dependencies]
wedb_test.workspace = true
aok = { workspace = true }
ctor = { workspace = true }
log = { workspace = true }
log_init = { workspace = true }

[lints]
workspace = true
