[package]
name = "wconf"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wconf"
description = "Configuration options and runtime server configuration for wedb"
keywords = ["config", "settings", "runtime-configuration", "garnet", "database"]

[lints]
workspace = true

[dependencies]
bitflags.workspace = true
itoa.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
wbase = { workspace = true, features = ["hash_slot"] }

[dev-dependencies]
aok.workspace = true
ctor.workspace = true
log_init.workspace = true
