[package]
name = "wacl"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/webc-site/wedb/tree/main/wacl"
description = "Access Control List and authentication with SHA-256 password hashing"
keywords = [ "acl", "authentication", "authorization", "security" ]
categories = [ "authentication" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dependencies]
bitcode.workspace = true

sha2.workspace = true
thiserror.workspace = true
wbase = { workspace = true, features = ["map", "hex", "set"] }
wresp.workspace = true


[lints]
workspace = true
