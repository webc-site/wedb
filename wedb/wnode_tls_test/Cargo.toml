[package]
name = "wnode_tls_test"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/webc-site/wedb/tree/main/wnode_tls_test"
description = "TLS integration-test support over wnode: self-signed cert fixture, echo/quit stubs, RESP socket IO"
keywords = ["tls", "test", "testing", "fixtures"]
categories = ["development-tools", "development-tools::testing"]

[features]
tls = ["wnode/tls"]

[dependencies]
aok.workspace = true
compio = { workspace = true, features = ["net", "io", "runtime", "time"] }
compio-tls = { workspace = true, default-features = false, features = ["rustls", "ring"] }
rcgen = "0.14.10"
wnode.workspace = true
wnode_test.workspace = true
wtls.workspace = true

[dev-dependencies]
compio = { workspace = true, features = ["macros", "runtime"] }
socket2 = "0.6.5"
tempfile.workspace = true
time = { version = "0.3.55", features = ["parsing"] }
waof.workspace = true
wbase = { workspace = true, features = ["hash_slot"] }
wdev.workspace = true
wedb = { workspace = true, features = ["tls"] }
wedb_test.workspace = true
wkv.workspace = true
wtest_base.workspace = true
wtxn.workspace = true

[lints]
workspace = true
