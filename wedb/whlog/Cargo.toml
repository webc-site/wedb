[package]
name = "whlog"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/webc-site/wedb/tree/main/whlog"
description = "HybridLog allocator with three-region sliding window and scan iterator"
keywords = ["hybridlog", "allocator", "storage-engine", "circular-buffer", "log"]
categories = ["database-implementations", "data-structures", "concurrency", "asynchronous", "memory-management"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
itoa = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
wdev = { workspace = true }
wepoch = { workspace = true }
wrecord = { workspace = true }
wbase = { workspace = true, features = ["addr", "align", "backoff", "cfg", "pool", "thread"] }
zmij = { workspace = true }
event-listener.workspace = true

[dependencies.compio]
workspace = true
features = ["runtime", "time"]

[dev-dependencies]
aok = { workspace = true }
compio = { workspace = true, features = ["macros", "runtime"] }
ctor = { workspace = true }
log_init = { workspace = true }
tempfile = { workspace = true }
whasher = { workspace = true }

[lints]
workspace = true
