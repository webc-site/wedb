[package]
name = "wedb_standalone"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wedb_standalone"
description = "Standalone server foundation: RESP protocol, AOF logic layer, and node service orchestration"
keywords = [ "server", "database", "resp", "redis", "aof" ]
categories = [ "database-implementations", "network-programming" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]
bench = [ ]

[dependencies]
wlua = { version = "0.1.0", path = "../wlua" }

[dependencies.wconf]
workspace = true

[dependencies.wnode]
workspace = true

[dependencies.clap]
version = "4.6.6"
features = [ "derive" ]

[dev-dependencies]
gxhash.workspace = true
itoa.workspace = true
parking_lot = { workspace = true, features = ["arc_lock"] }
wacl.workspace = true
waof.workspace = true
wbase = { workspace = true, features = ["convert", "ascii", "num", "entry_type", "hash_slot", "hash", "crc64", "glob", "time"] }
wcol.workspace = true
wdatabase.workspace = true
wdev.workspace = true
whasher.workspace = true
wkv.workspace = true
wmetric.workspace = true
wpubsub.workspace = true
wresp.workspace = true
wtxn.workspace = true
wval.workspace = true
wvector.workspace = true

[dev-dependencies.wbitmap]
workspace = true

[dev-dependencies.wedb_test]
workspace = true

[dev-dependencies.wnode_test]
workspace = true

[dev-dependencies.aok]
workspace = true

[dev-dependencies.ctor]
workspace = true

[dev-dependencies.log_init]
workspace = true

[dev-dependencies.wbftree]
workspace = true

[dev-dependencies.wcpr]
workspace = true

[dev-dependencies.compio]
workspace = true

[dev-dependencies.tempfile]
workspace = true

[lints]
workspace = true

[[bin]]
name = "wedb-standalone"
path = "src/main.rs"
