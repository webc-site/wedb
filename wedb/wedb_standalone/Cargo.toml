[package]
name = "wedb_standalone"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wedb_standalone"
description = "Standalone server foundation: RESP protocol, AOF logic layer, and node service orchestration"
keywords = [ "server", "database", "resp", "redis", "aof" ]
categories = [ "database-implementations", "network-programming" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]
bench = [ ]

[dependencies]
wcol = { workspace = true }

[dependencies.wconf]
workspace = true

[dependencies.wdatabase]
workspace = true

[dependencies.wmetric]
workspace = true

[dependencies.wvector]
workspace = true

[dependencies.gxhash]
workspace = true

[dependencies.parking_lot]
workspace = true
features = [ "arc_lock" ]

[dependencies.wval]
workspace = true

[dependencies.wnode]
workspace = true

[dependencies.wpubsub]
workspace = true

[dependencies.wtxn]
workspace = true

[dependencies.clap]
version = "4.6.6"
features = [ "derive" ]

[dependencies.compio]
workspace = true

[dependencies.itoa]
workspace = true

[dependencies.waof]
workspace = true

[dependencies.wdev]
workspace = true

[dependencies.whasher]
workspace = true

[dependencies.wkv]
workspace = true

[dependencies.wlua]
workspace = true

[dependencies.wresp]
workspace = true

[dependencies.wbase]
features = [
"convert",
"ascii",
"num",
"hash_slot",
"hash",
"crc64",
"glob",
"time"
]
workspace = true

[dependencies.wacl]
workspace = true

[dev-dependencies.wbitmap]
workspace = true

[dev-dependencies.aok]
workspace = true

[dev-dependencies.ctor]
workspace = true

[dev-dependencies.log_init]
workspace = true

[dev-dependencies.wbftree]
workspace = true

[dev-dependencies.wcpr]
workspace = true

[dev-dependencies.compio]
workspace = true

[dev-dependencies.tempfile]
workspace = true

[lints]
workspace = true

[[bin]]
name = "wedb-standalone"
path = "src/main.rs"
