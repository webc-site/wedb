[package]
name = "wresp"
version = "0.1.4"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wresp"
description = "RESP (REdis Serialization Protocol) response writer and serializer"
keywords = ["resp", "redis", "protocol", "serialization"]
categories = ["network-programming", "encoding"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitflags.workspace = true

itoa.workspace = true
serde = { workspace = true, features = ["derive"] }
smallvec.workspace = true
sonic-rs.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
wbase = { workspace = true, features = ["map", "num", "store_type"] }
zmij.workspace = true

[dev-dependencies]
aok.workspace = true
ctor.workspace = true
log.workspace = true
log_init.workspace = true


[lints]
workspace = true
