[package]
name = "wresp"
version = "0.1.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wresp"
description = "RESP (REdis Serialization Protocol) response writer and serializer"
keywords = ["resp", "redis", "protocol", "serialization"]
categories = ["network-programming", "encoding"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
itoa.workspace = true
num_enum = "0.7.6"
thiserror.workspace = true

[dev-dependencies]
aok.workspace = true
ctor.workspace = true
log.workspace = true
log_init.workspace = true


[lints]
workspace = true
