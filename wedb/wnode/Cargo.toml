[package]
name = "wnode"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/wedb.git"
homepage = "https://github.com/webc-site/wedb/tree/main/wnode"
description = "Core server node runtime, network transport, and request handling for wedb"

[features]
default = []
bench = []

[dependencies]
bitflags.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
compio = { workspace = true, features = ["net", "io", "signal", "runtime", "time", "bytes", "dispatcher"] }
crossfire = "3.1.20"
event-listener.workspace = true
fastrand.workspace = true
gxhash.workspace = true
itoa.workspace = true
log.workspace = true
memchr = "2.8.3"
nested-text = "0.1.0"
parking_lot = { workspace = true, features = ["arc_lock"] }
serde = { workspace = true, features = ["derive"] }
smallvec = "1.16.1"
sonic-rs.workspace = true
thiserror.workspace = true
wacl.workspace = true
waof.workspace = true
wbase = { workspace = true, features = ["ascii", "convert", "crc64", "future", "glob", "hash", "hash_slot", "num", "pool", "time"] }
wbftree.workspace = true
wbitmap.workspace = true
wcol = { version = "0.1.0", path = "../wcol" }
wconf.workspace = true
wcpr = { version = "0.1.3", path = "../wcpr" }
wcustom.workspace = true
wdatabase.workspace = true
wdev.workspace = true
whasher.workspace = true
whyperlog.workspace = true
wkv.workspace = true
wlua.workspace = true
wmetric.workspace = true
wpubsub.workspace = true
wresp.workspace = true
wtxn.workspace = true
wval.workspace = true
wvector.workspace = true
zmij.workspace = true

[lints]
workspace = true

[dev-dependencies]
aok.workspace = true
ctor.workspace = true
log_init.workspace = true
tempfile.workspace = true
